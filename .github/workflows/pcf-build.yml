name: PCF Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build PCF
        run: npm run build

      - name: Embed dashboard Web Resource content
        shell: pwsh
        run: |
          $htmlPath = "Solution/src/WebResources/el_/TreatmentRequestsDashboard.html"
          $customizationsPath = "Solution/src/Other/Customizations.xml"
          $content = [Convert]::ToBase64String([IO.File]::ReadAllBytes($htmlPath))
          $xml = [IO.File]::ReadAllText($customizationsPath)
          $xml = $xml.Replace("__TREATMENT_REQUESTS_DASHBOARD_CONTENT__", $content)
          [IO.File]::WriteAllText($customizationsPath, $xml, [Text.UTF8Encoding]::new($false))

      - name: Build Dataverse solution package
        run: dotnet build Solution/Solution.cdsproj -c Release

      - name: Upload PCF output
        uses: actions/upload-artifact@v5
        with:
          name: pcf-out
          path: |
            out/**
            Solution/bin/Release/**
            Solution/**/obj/**
          if-no-files-found: warn

      - name: Upload Dataverse solution zips
        uses: actions/upload-artifact@v5
        with:
          name: dataverse-solution-zips
          path: |
            Solution/bin/Release/**/*.zip
            Solution/bin/Debug/**/*.zip
          if-no-files-found: warn
